<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management System</title>
  <!-- Tailwind CSS CDN -->
  <script src="[link removed]"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800">ระบบจัดการผู้ใช้งาน (User Management)</h1>
      <p class="text-slate-500 mt-1 text-sm">เชื่อมต่อ Node.js, Express & MongoDB Atlas</p>
    </div>

    <!-- Alert Message Box -->
    <div id="alertBox" class="hidden p-4 rounded-lg text-sm font-medium shadow-sm transition-all"></div>

    <!-- Form Container -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 id="formTitle" class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
        <span>➕</span> เพิ่มผู้ใช้ใหม่
      </h2>
      
      <form id="userForm" class="space-y-4">
        <!-- Hidden input สำหรับเก็บ ID เวลาอัปเดต -->
        <input type="hidden" id="userId" value="">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Name Input -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อ-นามสกุล</label>
            <input type="text" id="name" required placeholder="สมชาย ใจดี" 
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          </div>

          <!-- Email Input -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">อีเมล</label>
            <input type="email" id="email" required placeholder="somchai@example.com" 
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          </div>

          <!-- Password Input -->
          <div id="passwordContainer">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
            <input type="password" id="password" required placeholder="••••••••" 
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-2 pt-2">
          <button type="submit" id="submitBtn" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition shadow-sm">
            บันทึกข้อมูล
          </button>
          <button type="button" id="cancelBtn" 
            class="hidden bg-slate-400 hover:bg-slate-500 text-white font-medium px-5 py-2 rounded-lg text-sm transition shadow-sm">
            ยกเลิก
          </button>
        </div>
      </form>
    </div>

    <!-- User Table List -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
          <span>👥</span> รายชื่อผู้ใช้งานทั้งหมด
        </h2>
        <button id="refreshBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-3 py-1.5 rounded-lg transition">
          🔄 รีเฟรชข้อมูล
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase">
              <th class="p-3">ID</th>
              <th class="p-3">ชื่อ</th>
              <th class="p-3">อีเมล</th>
              <th class="p-3 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="4" class="p-4 text-center text-slate-400">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- นำเข้าไฟล์ JavaScript แยก -->
  <script src="app.js"></script>
</body>
</html>
