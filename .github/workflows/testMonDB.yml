name: Run Unit Tests & MongoDB Integration

on:
  push:
    branches: [ "main", "master", "Mongo" ]
  pull_request:
    branches: [ "main", "master", "Mongo" ]
  # กดรันเองได้จากแท็บ Actions บน GitHub
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ไม่ใช้ .env และไม่ต่อ MongoDB Atlas จริง
    # test ใช้ mongodb-memory-server (ดาวน์โหลด mongod มารันใน runner เอง)
    env:
      NODE_ENV: test
      CI: true
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npx jest --ci --runInBand --detectOpenHandles --forceExit